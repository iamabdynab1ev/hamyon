services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cashew}
      POSTGRES_USER: ${POSTGRES_USER:-cashew}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cashew}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cashew}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cashew}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      HTTP_ADDR: ":8080"
      STORAGE_DIR: /app/data/files
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - sync-files:/app/data/files

volumes:
  db-data:
  sync-files:
